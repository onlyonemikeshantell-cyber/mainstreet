services:
  - type: web
    name: mainstreet-exchange
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://mainstreetcapitalx.com
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
