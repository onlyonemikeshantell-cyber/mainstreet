services:
  - type: web
    name: mainstreet-exchange
    runtime: node
    plan: free # Upgrade to 'starter' to enable persistent disk below
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://mainstreetcapitalx.com
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
    # To attach persistent storage on Render (retains database & KYC across deploys):
    # Change plan to 'starter' and uncomment:
    # disk:
    #   name: mainstreet-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # envVars:
    #   - key: DATA_DIR
    #     value: /var/data
